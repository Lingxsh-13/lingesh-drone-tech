<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>LINGESH DRONE TECH</title>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html,body{
    width:100%;
    min-height:100%;
}

body{
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    overflow:hidden;

    background:
        radial-gradient(circle at 20% 30%,rgba(32,224,178,.12),transparent 30%),
        radial-gradient(circle at 80% 70%,rgba(0,170,255,.08),transparent 30%),
        #020b0b;

    color:white;
    font-family:Arial,sans-serif;
    text-align:center;
    position:relative;
}

/* FUTURISTIC GRID */

body::before{
    content:"";
    position:absolute;
    inset:0;

    background-image:
        linear-gradient(rgba(32,224,178,.035) 1px,transparent 1px),
        linear-gradient(90deg,rgba(32,224,178,.035) 1px,transparent 1px);

    background-size:50px 50px;
    animation:gridMove 12s linear infinite;
    pointer-events:none;
}

@keyframes gridMove{
    from{background-position:0 0;}
    to{background-position:50px 50px;}
}

/* GLOW CIRCLE */

body::after{
    content:"";
    position:absolute;

    width:450px;
    height:450px;

    border-radius:50%;
    border:1px solid rgba(32,224,178,.08);

    box-shadow:
        0 0 80px rgba(32,224,178,.06),
        inset 0 0 80px rgba(32,224,178,.04);

    animation:circlePulse 5s ease-in-out infinite;
}

@keyframes circlePulse{

    0%,100%{
        transform:scale(.9);
        opacity:.5;
    }

    50%{
        transform:scale(1.1);
        opacity:1;
    }
}

/* PARTICLES */

.particles{
    position:fixed;
    inset:0;
    z-index:0;
    pointer-events:none;
}

.particles span{
    position:absolute;

    width:4px;
    height:4px;

    background:#20e0b2;
    border-radius:50%;

    box-shadow:0 0 10px #20e0b2;

    animation:particleFloat 6s linear infinite;
}

.particles span:nth-child(1){
    left:10%;
    top:80%;
}

.particles span:nth-child(2){
    left:25%;
    top:60%;
    animation-delay:1s;
}

.particles span:nth-child(3){
    left:45%;
    top:90%;
    animation-delay:2s;
}

.particles span:nth-child(4){
    left:65%;
    top:70%;
    animation-delay:3s;
}

.particles span:nth-child(5){
    left:80%;
    top:85%;
    animation-delay:4s;
}

.particles span:nth-child(6){
    left:90%;
    top:50%;
    animation-delay:5s;
}

@keyframes particleFloat{

    0%{
        transform:translateY(0) scale(.5);
        opacity:0;
    }

    20%{
        opacity:1;
    }

    80%{
        opacity:1;
    }

    100%{
        transform:translateY(-180px) scale(1);
        opacity:0;
    }
}

/* WELCOME BOX */

.welcome{
    position:relative;
    z-index:2;

    width:90%;
    max-width:850px;

    padding:55px 30px;

    border:1px solid rgba(32,224,178,.35);
    border-radius:30px;

    background:rgba(3,20,20,.65);

    backdrop-filter:blur(12px);
    -webkit-backdrop-filter:blur(12px);

    box-shadow:
        0 0 35px rgba(32,224,178,.12),
        inset 0 0 30px rgba(32,224,178,.03);

    animation:
        boxGlow 3s ease-in-out infinite,
        welcomeEntry 1.2s ease-out;
}

.welcome::before{
    content:"";

    position:absolute;
    inset:-2px;

    border-radius:30px;

    border:1px solid #20e0b2;

    opacity:.25;

    pointer-events:none;

    animation:welcomeBorderGlow 2.5s ease-in-out infinite alternate;
}

@keyframes welcomeBorderGlow{

    from{
        opacity:.15;
        box-shadow:0 0 5px rgba(32,224,178,.2);
    }

    to{
        opacity:.8;

        box-shadow:
            0 0 20px rgba(32,224,178,.35),
            0 0 45px rgba(32,224,178,.12);
    }
}

@keyframes welcomeEntry{

    from{
        opacity:0;
        transform:translateY(35px) scale(.96);
        filter:blur(8px);
    }

    to{
        opacity:1;
        transform:translateY(0) scale(1);
        filter:blur(0);
    }
}

@keyframes boxGlow{

    0%,100%{
        box-shadow:
            0 0 25px rgba(32,224,178,.12),
            inset 0 0 25px rgba(32,224,178,.03);
    }

    50%{
        box-shadow:
            0 0 50px rgba(32,224,178,.28),
            inset 0 0 35px rgba(32,224,178,.06);
    }
}

/* LOGO */

.logo{
    font-size:18px;
    font-weight:bold;

    letter-spacing:4px;

    margin-bottom:30px;

    color:#d9eeee;
}

.logo span{
    color:#20e0b2;

    text-shadow:
        0 0 10px rgba(32,224,178,.8),
        0 0 25px rgba(32,224,178,.3);
}

/* TITLE */

h1{
    font-size:clamp(42px,7vw,72px);

    line-height:1.05;

    margin-bottom:22px;

    letter-spacing:2px;

    text-shadow:
        0 0 15px rgba(32,224,178,.25);

    animation:titleGlow 2.5s ease-in-out infinite alternate;
}

@keyframes titleGlow{

    from{
        text-shadow:
            0 0 10px rgba(32,224,178,.15);
    }

    to{
        text-shadow:
            0 0 15px rgba(32,224,178,.35),
            0 0 35px rgba(32,224,178,.15);
    }
}

/* SUBTITLE */

p{
    font-size:18px;

    line-height:1.7;

    color:#b9c8c5;

    margin-bottom:35px;

    animation:subtitleFade 2s ease-out;
}

@keyframes subtitleFade{

    from{
        opacity:0;
        transform:translateY(12px);
    }

    to{
        opacity:1;
        transform:translateY(0);
    }
}

/* EXPLORE BUTTON */

.explore{
    display:inline-block;

    position:relative;
    overflow:hidden;

    padding:15px 38px;

    background:#20e0b2;
    color:#061313;

    text-decoration:none;

    font-weight:bold;
    letter-spacing:2px;

    border-radius:30px;

    box-shadow:
        0 0 25px rgba(32,224,178,.35);

    transition:.35s ease;

    animation:explorePulse 2.2s ease-in-out infinite;
}

@keyframes explorePulse{

    0%,100%{
        box-shadow:
            0 0 20px rgba(32,224,178,.3);
    }

    50%{
        box-shadow:
            0 0 30px rgba(32,224,178,.55),
            0 0 60px rgba(32,224,178,.15);
    }
}

.explore::after{
    content:"";

    position:absolute;

    top:-50%;
    left:-120px;

    width:60px;
    height:200%;

    background:rgba(255,255,255,.35);

    transform:rotate(25deg);

    animation:buttonShine 3s linear infinite;
}

@keyframes buttonShine{

    0%{
        left:-120px;
    }

    100%{
        left:120%;
    }
}

.explore:hover{

    transform:
        translateY(-5px)
        scale(1.04);

    box-shadow:
        0 0 35px rgba(32,224,178,.65),
        0 0 70px rgba(32,224,178,.18);
}

/* REALISTIC DRONE */

.index-drone{
    position:fixed;

    top:20%;
    left:-180px;

    z-index:1;

    pointer-events:none;

    animation:realisticDroneFlight 18s ease-in-out infinite;

    will-change:transform,left,top;
}

@keyframes realisticDroneFlight{

    0%{
        left:-180px;
        top:18%;
        transform:translateY(0) rotate(2deg) scale(.75);
    }

    15%{
        left:18%;
        top:14%;
        transform:translateY(-8px) rotate(-2deg) scale(.8);
    }

    30%{
        left:42%;
        top:22%;
        transform:translateY(7px) rotate(2deg) scale(.78);
    }

    45%{
        left:68%;
        top:16%;
        transform:translateY(-6px) rotate(-2deg) scale(.82);
    }

    60%{
        left:82%;
        top:38%;
        transform:translateY(8px) rotate(3deg) scale(.76);
    }

    75%{
        left:55%;
        top:62%;
        transform:translateY(-7px) rotate(-2deg) scale(.8);
    }

    90%{
        left:25%;
        top:48%;
        transform:translateY(6px) rotate(2deg) scale(.78);
    }

    100%{
        left:110%;
        top:30%;
        transform:translateY(0) rotate(-2deg) scale(.75);
    }
}

.real-drone{
    position:relative;

    width:150px;
    height:70px;

    transform:scale(.8);

    transform-origin:center;

    filter:
        drop-shadow(0 8px 10px rgba(0,0,0,.55))
        drop-shadow(0 0 8px rgba(32,224,178,.25));

    animation:droneHover .22s ease-in-out infinite alternate;
}

@keyframes droneHover{

    from{
        transform:
            translateY(-1px)
            rotate(-.4deg);
    }

    to{
        transform:
            translateY(2px)
            rotate(.4deg);
    }
}

/* DRONE BODY */

.drone-body{
    position:absolute;

    width:72px;
    height:30px;

    left:39px;
    top:20px;

    border-radius:
        18px 18px 12px 12px;

    background:
        linear-gradient(
            145deg,
            #3b4545,
            #111919 55%,
            #050909
        );

    border:1px solid #526060;

    box-shadow:
        inset 0 3px 5px rgba(255,255,255,.12),
        inset 0 -5px 8px rgba(0,0,0,.7);
}

.drone-body::before{
    content:"";

    position:absolute;

    width:45px;
    height:12px;

    left:13px;
    top:-5px;

    border-radius:50%;

    background:#263131;

    border:1px solid #4d5a5a;
}

/* DRONE ARMS */

.drone-arm{
    position:absolute;

    width:55px;
    height:7px;

    top:31px;

    background:
        linear-gradient(
            90deg,
            #111818,
            #465151,
            #111818
        );

    border-radius:8px;

    box-shadow:
        0 3px 5px rgba(0,0,0,.5);
}

.arm-left{
    left:3px;
    transform:rotate(-16deg);
}

.arm-right{
    right:3px;
    transform:rotate(16deg);
}

/* MOTORS */

.motor{
    position:absolute;

    width:18px;
    height:18px;

    top:25px;

    border-radius:50%;

    background:
        radial-gradient(
            circle,
            #596565 0 25%,
            #111 30% 70%,
            #050707 72%
        );

    border:1px solid #687575;

    z-index:3;
}

.motor-left{
    left:-2px;
}

.motor-right{
    right:-2px;
}

/* PROPELLERS */

.propeller{
    position:absolute;

    width:48px;
    height:5px;

    left:-15px;
    top:6px;

    border-radius:50%;

    border-top:
        2px solid rgba(220,230,230,.65);

    border-bottom:
        2px solid rgba(120,140,140,.35);

    opacity:.65;

    filter:blur(.6px);

    box-shadow:
        0 0 6px rgba(220,230,230,.25),
        0 0 12px rgba(220,230,230,.08);

    animation:
        propSpin .12s linear infinite;
}

@keyframes propSpin{

    0%{
        transform:rotate(0deg) scaleX(1);
    }

    50%{
        transform:rotate(180deg) scaleX(.25);
    }

    100%{
        transform:rotate(360deg) scaleX(1);
    }
}

/* CAMERA */

.drone-camera{
    position:absolute;

    width:18px;
    height:14px;

    left:27px;
    bottom:-9px;

    border-radius:5px;

    background:
        linear-gradient(
            145deg,
            #202828,
            #050808
        );

    border:1px solid #596565;
}

.drone-camera::after{
    content:"";

    position:absolute;

    width:8px;
    height:8px;

    left:4px;
    top:2px;

    border-radius:50%;

    background:#050909;

    border:1px solid #607070;

    box-shadow:
        inset 0 0 4px #20e0b2;
}

/* DRONE LIGHT */

.drone-light{
    position:absolute;

    width:5px;
    height:5px;

    right:7px;
    top:9px;

    border-radius:50%;

    background:#20e0b2;

    box-shadow:
        0 0 5px #20e0b2,
        0 0 12px #20e0b2;

    animation:
        droneBlink .8s ease-in-out infinite alternate;
}

@keyframes droneBlink{

    from{
        opacity:.25;
    }

    to{
        opacity:1;
    }
}

/* DRONE SHADOW */

.index-drone::before{
    content:"";

    position:absolute;

    width:75px;
    height:14px;

    left:38px;
    top:82px;

    background:rgba(0,0,0,.55);

    border-radius:50%;

    filter:blur(8px);

    transform:scaleX(.8);

    opacity:.6;

    animation:
        droneShadow 1s ease-in-out infinite alternate;
}

@keyframes droneShadow{

    from{
        transform:scaleX(.7);
        opacity:.4;
    }

    to{
        transform:scaleX(.95);
        opacity:.7;
    }
}

/* MOBILE */

@media(max-width:600px){

    .welcome{
        width:92%;
        padding:40px 20px;
        border-radius:22px;
    }

    .logo{
        font-size:14px;
        letter-spacing:2px;
    }

    h1{
        font-size:38px;
    }

    p{
        font-size:15px;
    }

    .explore{
        padding:14px 30px;
    }

    .real-drone{
        transform:scale(.65);
    }

    .particles span{
        width:3px;
        height:3px;
    }
}

</style>
</head>

<body>

<!-- FLOATING PARTICLES -->

<div class="particles">
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
    <span></span>
</div>

<!-- REALISTIC DRONE -->

<div class="index-drone">

    <div class="real-drone">

        <div class="drone-arm arm-left"></div>
        <div class="drone-arm arm-right"></div>

        <div class="motor motor-left">
            <div class="propeller"></div>
        </div>

        <div class="motor motor-right">
            <div class="propeller"></div>
        </div>

        <div class="drone-body">

            <div class="drone-camera"></div>
            <div class="drone-light"></div>

        </div>

    </div>

</div>

<!-- WELCOME -->

<div class="welcome">

    <div class="logo">
        ✦ <span>LINGESH</span> DRONE TECH
    </div>

    <h1>
        Welcome to<br>
        Lingesh Drone Tech
    </h1>

    <p>
        Drone Photography • Cinematography • Aerial Creativity
    </p>

    <a href="home.html" class="explore">
        EXPLORE
    </a>

</div>

</body>
</html>
