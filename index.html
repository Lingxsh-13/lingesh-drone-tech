<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>LINGESH DRONE TECH</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #061313;
            color: white;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        .welcome {
            padding: 40px 20px;
            max-width: 700px;
        }

        .logo {
            font-size: 22px;
            font-weight: bold;
            margin-bottom: 35px;
        }

        .logo span {
            color: #20e0b2;
        }

        h1 {
            font-size: 55px;
            margin-bottom: 20px;
        }

        p {
            font-size: 18px;
            color: #b9c8c5;
            margin-bottom: 35px;
        }

        .explore {
            display: inline-block;
            padding: 16px 35px;
            background: #20e0b2;
            color: #061313;
            text-decoration: none;
            font-weight: bold;
            border-radius: 8px;
        }

        .explore:hover {
            transform: translateY(-3px);
        }

        @media (max-width: 600px) {
            h1 {
                font-size: 38px;
            }

            p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <div class="welcome">

        <div class="logo">
            ✦ <span>LINGESH</span> DRONE TECH
        </div>

        <h1>Welcome to<br>Lingesh Drone Tech</h1>

        <p>
            Drone Photography • Cinematography • Aerial Creativity
        </p>

        <a href="home.html" class="explore">
            EXPLORE
        </a>

    </div>

</body>
</html>
